# QYRO EfficientNet-B0 Severity Grading Configuration
model_params:
  backbone: "efficientnet_b0"
  pretrained: true
  num_classes: 4             # stage_1, stage_2, stage_3, stage_4
  input_size: 224
  seed: 42
  deterministic: true

dataset_params:
  data_dir: "datasets/skin/acne/final/severity"
  manifest_path: "datasets/skin/acne/final/metadata/severity_manifest.csv"
  num_workers: 0
  pin_memory: true
  prefetch_factor: 2
  batch_size: 32             # Baseline batch size for RTX 5050 (avoid OOM)

training_params:
  epochs: 50
  optimizer: "AdamW"
  weight_decay: 0.0001
  loss_type: "ordinal_cross_entropy" # Approved Modification: Priority Ordinal Regression
  
  # Transfer Learning Strategy
  head_only_epochs: 10       # Phase 1: Train classification head only
  head_lr: 0.0005
  
  fine_tune_epochs: 40       # Phase 2: Full fine-tuning
  fine_tune_lr: 0.00005
  
  scheduler: "CosineAnnealingLR"
  early_stopping_patience: 8

augmentation_params:
  horizontal_flip: 0.5
  vertical_flip: 0.0         # Approved Modification: NO vertical flips
  coarse_dropout_prob: 0.2
  brightness_contrast: 0.2
  grid_distortion: 0.2

logging_params:
  project: "experiments/severity"
  name: "effnet_b0_qyro_severity_v1"
  log_frequency_steps: 10
  save_best_only: true
